<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>德语刷词 · Deutsch Drill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d141c'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Georgia' fill='%23d8a44a' text-anchor='middle'%3EDE%3C/text%3E%3C/svg%3E">
<style>
/* =========================================================
   德语刷词 · Deutsch Drill
   固定尺寸布局：整页不滚动、不可缩放，滚动只发生在内容区内
   ========================================================= */

:root{
  --bg:#080c11;
  --bg-2:#0b1119;
  --rail:#0a0f16;
  --panel:#0f1620;
  --panel-2:#131d29;
  --panel-3:#18242f;
  --line:#1d2a38;
  --line-2:#263748;
  --text:#e8eef6;
  --text-2:#c2cfdd;
  --muted:#7e90a4;
  --dim:#5a6b7d;
  --gold:#d8a44a;
  --gold-2:#f0c877;
  --green:#4fc79b;
  --green-d:#123a2f;
  --red:#ef7070;
  --red-d:#3a1a1e;
  --blue:#63a6e0;
  --rail-w:238px;
  --top-h:62px;
  --r:14px;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);}
body{
  font-family:var(--sans);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
  user-select:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit;touch-action:manipulation;}
::selection{background:rgba(216,164,74,.28);}

/* 背景细纹 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 620px at 78% -12%,rgba(216,164,74,.10),transparent 62%),
    radial-gradient(900px 520px at 8% 108%,rgba(99,166,224,.09),transparent 60%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px);
}

#app{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:var(--rail-w) minmax(0,1fr);
  height:100vh;
  height:100dvh;
  min-width:1080px;
  overflow:hidden;
}

/* ============================ 左侧栏 ============================ */
.rail{
  display:flex;flex-direction:column;
  min-height:0;
  background:linear-gradient(180deg,#0a1017,#080c12 60%);
  border-right:1px solid var(--line);
  padding:20px 14px 16px;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;}
.brand-mark{
  width:40px;height:40px;border-radius:11px;flex:0 0 auto;
  display:grid;place-items:center;
  background:linear-gradient(150deg,#1d2b39,#101821);
  border:1px solid var(--line-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.4);
  position:relative;overflow:hidden;
}
.brand-mark span{
  font-family:var(--serif);font-size:15px;letter-spacing:.08em;
  background:linear-gradient(180deg,var(--gold-2),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;
}
.brand-mark::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;
  background:linear-gradient(90deg,#000 33%,#c0392b 33% 66%,var(--gold) 66%);opacity:.85;}
.brand-t{font-size:14.5px;font-weight:600;letter-spacing:.04em;}
.brand-s{font-size:10px;color:var(--dim);letter-spacing:.22em;text-transform:uppercase;margin-top:1px;}

.nav{display:flex;flex-direction:column;gap:3px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  height:40px;padding:0 11px;border-radius:10px;
  color:var(--muted);font-size:13.5px;text-align:left;
  transition:background .15s,color .15s;
  position:relative;
}
.nav-item .ic{
  width:20px;text-align:center;font-style:normal;font-size:12px;
  font-family:var(--serif);color:var(--dim);transition:color .15s;
}
.nav-item:hover{background:rgba(255,255,255,.035);color:var(--text-2);}
.nav-item.active{background:linear-gradient(90deg,rgba(216,164,74,.14),rgba(216,164,74,.03));color:var(--text);}
.nav-item.active .ic{color:var(--gold);}
.nav-item.active::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--gold-2),var(--gold));
}
.pill{
  margin-left:auto;font-size:10.5px;font-weight:600;font-weight:600;
  min-width:20px;height:18px;padding:0 6px;border-radius:9px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.06);color:var(--muted);
  font-family:var(--mono);
}
.pill.hot{background:rgba(239,112,112,.16);color:#f0a0a0;}

.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;}
.rail-box{
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent);
}
.rail-box-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-2);}
.rail-box-p{margin:7px 0 0;font-size:10.5px;line-height:1.55;color:var(--dim);}
.rail-box-p b{color:var(--gold);}

.switch{
  width:36px;height:20px;border-radius:20px;background:#1d2833;position:relative;
  border:1px solid var(--line-2);transition:background .2s,border-color .2s;flex:0 0 auto;
}
.switch i{
  position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#5d6e80;transition:transform .2s,background .2s;
}
.switch.on{background:rgba(216,164,74,.22);border-color:rgba(216,164,74,.45);}
.switch.on i{transform:translateX(16px);background:var(--gold-2);}

.rail-mini{display:flex;gap:6px;font-size:10px;color:var(--dim);font-family:var(--mono);}
.rail-mini span{flex:1;text-align:center;padding:5px 0;border:1px solid var(--line);border-radius:7px;}
.rail-mini span b{display:block;color:var(--text-2);font-size:12.5px;font-family:var(--mono);font-weight:600;}

/* ============================ 顶栏 ============================ */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.topbar{
  height:var(--top-h);flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent);
}
.crumb{font-size:13px;color:var(--text-2);letter-spacing:.03em;}
.crumb b{color:var(--gold);font-weight:600;}
.topstats{display:flex;gap:8px;}
.chip{
  display:flex;align-items:center;gap:7px;
  height:28px;padding:0 11px;border-radius:8px;
  border:1px solid var(--line);background:rgba(255,255,255,.02);
  font-size:11.5px;color:var(--muted);
}
.chip b{color:var(--text);font-family:var(--mono);font-size:12px;font-weight:600;}
.chip.good b{color:var(--green);}
.chip.bad b{color:var(--red);}
.chip.warm b{color:var(--gold);}

.stage{flex:1 1 auto;min-height:0;position:relative;}
.view{display:none;height:100%;min-height:0;}
.view.active{display:flex;flex-direction:column;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1 1 auto;}
.scroll::-webkit-scrollbar{width:9px;}
.scroll::-webkit-scrollbar-thumb{background:#1e2b3a;border-radius:9px;border:2px solid transparent;background-clip:content-box;}
.scroll::-webkit-scrollbar-thumb:hover{background:#2a3c4f;background-clip:content-box;}
.scroll::-webkit-scrollbar-track{background:transparent;}

.page{padding:24px 26px 30px;max-width:1180px;margin:0 auto;width:100%;}

/* ============================ 通用元件 ============================ */
.h1{font-size:22px;font-weight:600;letter-spacing:.02em;margin:0;}
.sub{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.6;}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;}
.section-h h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin:0;}
.section-h .more{font-size:11.5px;color:var(--dim);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:38px;padding:0 18px;border-radius:10px;
  font-size:13px;font-weight:500;letter-spacing:.02em;
  border:1px solid var(--line-2);background:rgba(255,255,255,.03);
  color:var(--text-2);
  transition:background .15s,border-color .15s,color .15s,transform .1s;
  white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.06);color:var(--text);border-color:#33475c;}
.btn:active{transform:translateY(1px);}
.btn.primary{
  background:linear-gradient(180deg,#e3b158,#cf9a3e);
  color:#1a1206;border-color:#e8bd6f;font-weight:600;
  box-shadow:0 6px 18px rgba(216,164,74,.18);
}
.btn.primary:hover{filter:brightness(1.06);color:#1a1206;}
.btn.ghost{background:transparent;}
.btn.danger{color:#f0a0a0;border-color:#3b2126;background:rgba(239,112,112,.06);}
.btn.danger:hover{background:rgba(239,112,112,.12);}
.btn.sm{height:30px;padding:0 12px;font-size:11.5px;border-radius:8px;}
.btn[disabled]{opacity:.35;pointer-events:none;}

.icon-btn{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--dim);font-size:13px;transition:.15s;
}
.icon-btn:hover{background:rgba(255,255,255,.06);color:var(--text);}

.card{
  border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}

/* ============================ 首页 ============================ */
.hero{
  position:relative;overflow:hidden;
  border-radius:18px;border:1px solid var(--line);
  background:
    radial-gradient(700px 300px at 90% -30%,rgba(216,164,74,.14),transparent 70%),
    linear-gradient(160deg,#101a25,#0b1219 70%);
  padding:28px 30px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
}
.hero::after{
  content:"A B C D";position:absolute;right:-6px;bottom:-46px;
  font-family:var(--serif);font-size:110px;letter-spacing:.06em;
  color:rgba(255,255,255,.012);pointer-events:none;white-space:nowrap;
}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
  margin-bottom:12px;
}
.hero-kicker::before{content:"";width:26px;height:1px;background:var(--gold);opacity:.6;}
.hero h1{margin:0;font-size:27px;letter-spacing:.01em;font-weight:600;}
.hero h1 em{
  font-style:normal;font-family:var(--serif);
  background:linear-gradient(180deg,#f6d190,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin:10px 0 0;color:var(--muted);font-size:13px;max-width:520px;line-height:1.7;}
.hero-side{display:flex;gap:26px;position:relative;z-index:2;padding-bottom:2px;}
.hero-stat{text-align:right;}
.hero-stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;}
.hero-stat span{font-size:10.5px;color:var(--dim);letter-spacing:.1em;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.module-card{
  position:relative;overflow:hidden;
  padding:22px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(165deg,#111a25,#0c131b);
  text-align:left;transition:border-color .18s,transform .18s,box-shadow .18s;
  display:block;width:100%;
}
.module-card:hover{border-color:#33475c;transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.34);}
.module-card .top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:34px;}
.module-num{
  font-family:var(--serif);font-size:13px;letter-spacing:.1em;
  color:var(--gold);border:1px solid rgba(216,164,74,.34);
  padding:3px 9px;border-radius:7px;background:rgba(216,164,74,.07);
}
.module-cnt{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;line-height:1.7;}
.module-cnt b{display:block;color:var(--text-2);font-size:17px;font-weight:600;}
.module-card h3{margin:0 0 6px;font-size:17px;font-weight:600;}
.module-card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.65;}
.module-card .bar{
  margin-top:18px;height:4px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;
}
.module-card .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-2));}
.module-card .bar-lb{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:7px;font-family:var(--mono);}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat{padding:16px 18px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.016);}
.stat span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;margin-top:7px;letter-spacing:-.02em;}
.stat small{font-size:10.5px;color:var(--dim);font-family:var(--mono);}

.tip-card{
  margin-top:16px;padding:15px 18px;border-radius:12px;
  border:1px solid var(--line);border-left:2px solid var(--gold);
  background:linear-gradient(90deg,rgba(216,164,74,.05),transparent 60%);
  font-size:12px;color:var(--muted);line-height:1.75;
}
.tip-card b{color:var(--text-2);}

/* ============================ 模块页 ============================ */
.mod-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px;}
.mod-tag{font-size:10.5px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase;margin-bottom:9px;}
.mod-title{font-size:26px;margin:0;font-weight:600;}
.mod-desc{margin:8px 0 0;color:var(--muted);font-size:12.5px;line-height:1.7;max-width:560px;}

.start-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.start-card{
  padding:20px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(165deg,#111a25,#0c131b);
  display:flex;flex-direction:column;gap:14px;transition:.18s;
}
.start-card:hover{border-color:#33475c;}
.start-card h4{margin:0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:9px;}
.start-card h4 i{font-style:normal;font-family:var(--serif);color:var(--gold);font-size:12px;
  border:1px solid rgba(216,164,74,.3);border-radius:6px;padding:1px 7px;}
.start-card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.65;flex:1;}
.start-actions{display:flex;gap:8px;}
.start-actions .btn{flex:1;}

.opt-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:rgba(255,255,255,.02);}
.seg button{padding:6px 13px;font-size:11.5px;color:var(--muted);transition:.15s;}
.seg button:hover{color:var(--text-2);background:rgba(255,255,255,.04);}
.seg button.on{background:rgba(216,164,74,.16);color:var(--gold-2);}

/* ============================ 练习区 ============================ */
.practice-wrap{height:100%;display:flex;flex-direction:column;min-height:0;}
.pbar{
  flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:14px 26px;border-bottom:1px solid var(--line);
}
.pbar-track{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;}
.pbar-fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .3s ease;}
.pbar-meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;}
.pbar-meta b{color:var(--text-2);}
.pbar-tags{display:flex;gap:7px;}
.tag{
  font-size:10.5px;padding:3px 8px;border-radius:6px;
  border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.02);
  white-space:nowrap;
}
.tag.rev{border-color:rgba(216,164,74,.4);color:var(--gold);background:rgba(216,164,74,.08);}
.tag.ok{border-color:rgba(79,199,155,.35);color:var(--green);background:rgba(79,199,155,.07);}
.tag.no{border-color:rgba(239,112,112,.35);color:var(--red);background:rgba(239,112,112,.07);}

.q-area{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:28px 26px;display:flex;flex-direction:column;}
.q-area > .q-inner{margin:auto;width:100%;}
.q-area::-webkit-scrollbar{width:9px;}
.q-area::-webkit-scrollbar-thumb{background:#1e2b3a;border-radius:9px;border:2px solid transparent;background-clip:content-box;}
.q-inner{max-width:840px;margin:0 auto;}

.q-card{
  border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(170deg,#101a24,#0b1219 72%);
  padding:24px 26px 26px;position:relative;overflow:hidden;
  min-height:392px;display:flex;flex-direction:column;
}
.q-card::before{
  content:"";position:absolute;left:0;top:0;height:2px;width:100%;
  background:linear-gradient(90deg,var(--gold),transparent 46%);
  opacity:.65;
}
.q-kicker{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.q-kicker .k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
.q-kicker .sep{width:1px;height:11px;background:var(--line-2);}
.q-kicker .m{font-size:11px;color:var(--dim);}

.q-word{
  font-family:var(--serif);font-size:38px;line-height:1.15;letter-spacing:.005em;
  color:#f4f8fd;word-break:break-word;
}
.q-word .blank{
  display:inline-block;min-width:96px;border-bottom:2px solid rgba(216,164,74,.5);
  color:transparent;transform:translateY(-4px);
}
.q-cn{margin-top:9px;font-size:13.5px;color:var(--muted);letter-spacing:.02em;}
.q-ask{margin-top:18px;font-size:13px;color:var(--text-2);}
.q-ask b{color:var(--gold-2);font-weight:600;}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
.q-card > .feedback{margin-top:auto;}
.opt{
  display:flex;align-items:center;gap:12px;
  min-height:58px;padding:12px 16px;border-radius:12px;
  border:1px solid var(--line-2);background:rgba(255,255,255,.022);
  text-align:left;transition:.15s;position:relative;
}
.opt:hover{border-color:#3d5570;background:rgba(255,255,255,.05);}
.opt .key{
  width:22px;height:22px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;
  font-family:var(--mono);font-size:10.5px;color:var(--dim);
  border:1px solid var(--line-2);background:rgba(0,0,0,.2);
}
.opt .txt{font-family:var(--serif);font-size:19px;color:var(--text);letter-spacing:.01em;}
.opt .txt small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--dim);letter-spacing:0;margin-top:1px;}
.opt.correct{border-color:rgba(79,199,155,.65);background:rgba(79,199,155,.12);}
.opt.correct .key{border-color:rgba(79,199,155,.5);color:var(--green);background:rgba(79,199,155,.12);}
.opt.correct .txt{color:#a9f0d6;}
.opt.wrong{border-color:rgba(239,112,112,.6);background:rgba(239,112,112,.11);}
.opt.wrong .key{border-color:rgba(239,112,112,.5);color:var(--red);background:rgba(239,112,112,.12);}
.opt.wrong .txt{color:#ffb6b6;}
.opt.dim{opacity:.42;}
.opt .mark{position:absolute;right:13px;font-size:13px;color:var(--green);}
.opt.wrong .mark{color:var(--red);}

/* 填空 */
.fill-box{margin-top:20px;}
.fill-row{display:flex;gap:10px;align-items:stretch;}
.fill-input{
  flex:1;height:56px;border-radius:12px;
  border:1px solid var(--line-2);background:rgba(0,0,0,.28);
  color:var(--text);font-family:var(--serif);font-size:21px;letter-spacing:.01em;
  padding:0 18px;outline:none;transition:.15s;user-select:text;
}
.fill-input::placeholder{color:#41505f;font-size:14px;font-family:var(--sans);letter-spacing:.04em;}
.fill-input:focus{border-color:rgba(216,164,74,.55);box-shadow:0 0 0 3px rgba(216,164,74,.09);background:rgba(0,0,0,.38);}
.fill-input.ok{border-color:rgba(79,199,155,.6);color:#a9f0d6;box-shadow:0 0 0 3px rgba(79,199,155,.1);}
.fill-input.no{border-color:rgba(239,112,112,.55);color:#ffb6b6;box-shadow:0 0 0 3px rgba(239,112,112,.1);}
.fill-input:disabled{opacity:.95;}
.umlauts{display:flex;gap:6px;margin-top:10px;}
.um-btn{
  width:30px;height:28px;border-radius:7px;border:1px solid var(--line);
  color:var(--muted);font-family:var(--serif);font-size:13px;transition:.15s;
}
.um-btn:hover{color:var(--gold-2);border-color:rgba(216,164,74,.4);background:rgba(216,164,74,.07);}
.case-pick{display:flex;gap:8px;margin-top:12px;align-items:center;}
.case-pick .lb{font-size:11.5px;color:var(--dim);margin-right:2px;}
.case-btn{
  width:46px;height:34px;border-radius:9px;border:1px solid var(--line-2);
  font-family:var(--mono);font-size:12.5px;color:var(--muted);transition:.15s;
}
.case-btn:hover{color:var(--text-2);border-color:#3d5570;}
.case-btn.on{background:rgba(216,164,74,.18);border-color:rgba(216,164,74,.55);color:var(--gold-2);}
.fill-actions{display:flex;gap:9px;margin-top:14px;}

/* 反馈 */
.feedback{
  margin-top:18px;border-radius:14px;border:1px solid var(--line);
  padding:16px 18px;display:none;animation:pop .18s ease;
}
.feedback.show{display:block;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.feedback.ok{border-color:rgba(79,199,155,.32);background:linear-gradient(180deg,rgba(79,199,155,.08),rgba(79,199,155,.02));}
.feedback.no{border-color:rgba(239,112,112,.3);background:linear-gradient(180deg,rgba(239,112,112,.075),rgba(239,112,112,.015));}
.fb-head{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;}
.fb-head .dot{width:7px;height:7px;border-radius:50%;}
.feedback.ok .fb-head{color:#8fe6c4;}
.feedback.ok .dot{background:var(--green);box-shadow:0 0 10px rgba(79,199,155,.7);}
.feedback.no .fb-head{color:#ffb0b0;}
.feedback.no .dot{background:var(--red);box-shadow:0 0 10px rgba(239,112,112,.6);}
.fb-ans{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.9;}
.fb-ans .mono{font-family:var(--serif);font-size:16px;color:var(--text);letter-spacing:.01em;}
.fb-ans b{color:var(--gold-2);font-weight:600;}
.fb-note{
  margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.08);
  font-size:11.5px;color:var(--dim);line-height:1.7;display:flex;gap:8px;align-items:flex-start;
}
.fb-note .k{color:var(--gold);flex:0 0 auto;}

/* 底部操作 */
.q-foot{
  flex:0 0 auto;border-top:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(0deg,rgba(255,255,255,.016),transparent);
}
.q-foot .left{font-size:11.5px;color:var(--dim);line-height:1.6;}
.q-foot .left b{color:var(--gold);font-family:var(--mono);}
.q-foot .spacer{flex:1;}
.btn.next{min-width:150px;}

/* 结果页 */
.result{max-width:640px;margin:0 auto;text-align:center;padding:40px 0;}
.result .big{font-family:var(--mono);font-size:52px;letter-spacing:-.03em;}
.result .lb{color:var(--muted);font-size:12.5px;margin-top:6px;}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0;}
.result-grid .r{padding:14px;border:1px solid var(--line);border-radius:12px;}
.result-grid .r span{font-size:10.5px;color:var(--dim);letter-spacing:.1em;}
.result-grid .r b{display:block;font-family:var(--mono);font-size:19px;margin-top:5px;}

/* ============================ 错题本 / 列表 ============================ */
.filters{display:flex;gap:8px;align-items:center;margin:18px 0 12px;flex-wrap:wrap;}
.filter{
  height:30px;padding:0 13px;border-radius:8px;border:1px solid var(--line);
  font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.02);transition:.15s;
}
.filter:hover{color:var(--text-2);border-color:#33475c;}
.filter.on{background:rgba(216,164,74,.14);border-color:rgba(216,164,74,.4);color:var(--gold-2);}
.search{
  margin-left:auto;height:32px;width:210px;border-radius:9px;
  border:1px solid var(--line);background:rgba(0,0,0,.25);
  color:var(--text);padding:0 12px;font-size:12px;outline:none;font-family:var(--sans);
  user-select:text;
}
.search:focus{border-color:rgba(216,164,74,.45);}

.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.list-row{
  display:grid;grid-template-columns:1.15fr 1.5fr 1fr 96px 92px 74px;
  gap:14px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.012);transition:background .14s;
}
.list-row:last-child{border-bottom:0;}
.list-row:hover{background:rgba(255,255,255,.035);}
.list-row.head{
  background:rgba(255,255,255,.03);font-size:10.5px;letter-spacing:.12em;
  color:var(--dim);padding:9px 16px;
}
.list-row.head:hover{background:rgba(255,255,255,.03);}
.lr-de{font-family:var(--serif);font-size:16px;color:var(--text);letter-spacing:.01em;}
.lr-de small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--dim);letter-spacing:0;margin-top:2px;}
.lr-ans{font-family:var(--serif);font-size:14px;color:var(--text-2);}
.lr-ans em{font-style:normal;color:var(--gold-2);font-family:var(--sans);font-size:10.5px;border:1px solid rgba(216,164,74,.3);padding:0 5px;border-radius:5px;margin-left:5px;}
.lr-cn{font-size:11.5px;color:var(--muted);}
.lr-num{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center;}
.lr-act{display:flex;justify-content:flex-end;gap:4px;}
.mini-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:5px;overflow:hidden;}
.mini-bar i{display:block;height:100%;background:var(--gold);border-radius:3px;}
.empty{
  text-align:center;padding:52px 20px;color:var(--dim);font-size:12.5px;line-height:2;
}
.empty .em{font-family:var(--serif);font-size:34px;color:#26323f;display:block;margin-bottom:10px;}

.badge{
  display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;
  font-size:10px;border:1px solid var(--line);color:var(--dim);
}
.badge.warn{border-color:rgba(239,112,112,.35);color:#f0a0a0;background:rgba(239,112,112,.07);}
.badge.done{border-color:rgba(79,199,155,.3);color:var(--green);background:rgba(79,199,155,.06);}
.badge.rev{border-color:rgba(216,164,74,.35);color:var(--gold);background:rgba(216,164,74,.07);}

/* ============================ 笔记抽屉 ============================ */
.drawer-mask{
  position:fixed;inset:0;background:rgba(4,7,11,.55);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;
}
.drawer-mask.on{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:392px;z-index:41;
  background:linear-gradient(180deg,#0e161f,#0a1017);
  border-left:1px solid var(--line-2);
  transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;padding:20px;
  box-shadow:-24px 0 60px rgba(0,0,0,.5);
}
.drawer.on{transform:none;}
.drawer-h{display:flex;align-items:flex-start;justify-content:space-between;}
.drawer-k{font-size:10.5px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;}
.drawer-t{font-family:var(--serif);font-size:24px;margin-top:6px;}
.drawer-ref{
  margin:12px 0 14px;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.02);
  font-size:11.5px;color:var(--muted);line-height:1.75;
}
.drawer-ref .de{font-family:var(--serif);color:var(--text-2);font-size:14px;}
.drawer-ta{
  flex:1;min-height:0;resize:none;outline:none;
  border:1px solid var(--line);border-radius:12px;
  background:rgba(0,0,0,.28);color:var(--text);
  padding:14px;font-size:13px;line-height:1.85;font-family:var(--sans);
  user-select:text;
}
.drawer-ta:focus{border-color:rgba(216,164,74,.4);}
.drawer-f{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.drawer-status{font-size:10.5px;color:var(--dim);font-family:var(--mono);}

/* ============================ Toast ============================ */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
  padding:9px 18px;border-radius:10px;font-size:12px;
  background:rgba(20,30,41,.96);border:1px solid var(--line-2);color:var(--text-2);
  opacity:0;pointer-events:none;transition:.22s;z-index:60;
  box-shadow:0 12px 30px rgba(0,0,0,.45);white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* 键盘提示 */
.kbd{
  font-family:var(--mono);font-size:10px;color:var(--dim);
  border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;
  padding:0 4px;margin-left:6px;
}
.hidden{display:none !important;}

/* 存储不可用提示 */
.warnbar{
  margin-top:10px;padding:9px 11px;border-radius:9px;font-size:10.5px;line-height:1.6;
  border:1px solid rgba(239,112,112,.35);background:rgba(239,112,112,.08);color:#f0b0b0;
}
.reset-link{
  margin-top:10px;width:100%;text-align:center;font-size:10.5px;color:#4a5a6c;
  padding:6px;border-radius:8px;transition:.15s;
}
.reset-link:hover{color:#ef8f8f;background:rgba(239,112,112,.07);}

/* ============================ 手机扫码 ============================ */
.nav-item.only-mobile{display:none;}

/* 侧栏底部：错题本大入口 */
.mistake-card{
  display:flex;flex-direction:column;gap:7px;width:100%;
  padding:13px 14px 14px;margin-bottom:10px;border-radius:13px;
  border:1px solid var(--line);text-align:left;position:relative;overflow:hidden;
  background:linear-gradient(158deg,#141d28,#0c1219 78%);
  transition:border-color .18s,transform .18s,box-shadow .18s;
}
.mistake-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--red),rgba(239,112,112,0) 85%);opacity:.75;
}
.mistake-card:hover{border-color:#3a4f66;transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.35);}
.mistake-card:active{transform:translateY(0);}
.mc-row{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--text);}
.mc-row i{font-style:normal;font-size:11px;color:var(--red);}
.mc-num{
  margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;
  min-width:22px;height:20px;padding:0 8px;border-radius:10px;
  display:grid;place-items:center;
  background:rgba(239,112,112,.16);color:#f5a9a9;
}
.mc-num.zero{background:rgba(255,255,255,.06);color:var(--muted);}
.mc-sub{font-size:10.5px;color:var(--dim);line-height:1.5;}
.mc-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;display:block;}
.mc-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#d8624f,var(--red));transition:width .3s;}

.rail-act{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;height:34px;padding:0 12px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:9px;
  font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.02);
  transition:.15s;
}
.rail-act:hover{color:var(--gold-2);border-color:rgba(216,164,74,.35);background:rgba(216,164,74,.06);}
.rail-act i{font-style:normal;font-size:12px;color:var(--gold);}

.modal-mask{
  position:fixed;inset:0;background:rgba(4,7,11,.62);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;
}
.modal-mask.on{opacity:1;pointer-events:auto;}
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);
  width:380px;padding:22px;border-radius:18px;z-index:51;
  background:linear-gradient(180deg,#101a24,#0b1219);
  border:1px solid var(--line-2);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:.22s cubic-bezier(.3,.8,.3,1);
  text-align:center;
}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;text-align:left;margin-bottom:16px;}
.qr-box{
  background:#fff;border-radius:14px;padding:12px;display:inline-block;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  line-height:0;
}
.qr-box img{width:236px;height:236px;display:block;border-radius:6px;}
.qr-url{
  margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--gold-2);
  word-break:break-all;user-select:text;
}
.qr-hint{margin:8px 0 0;font-size:11px;color:var(--dim);line-height:1.7;}

/* ============================ 手机 / 平板 ============================ */
@media (max-width: 900px){
  html,body{overflow:hidden;}
  body{font-size:13px;}
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);min-width:0;}
  .rail{
    flex-direction:row;align-items:center;gap:4px;
    padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .brand{padding:0 6px 0 0;flex:0 0 auto;}
  .brand-mark{width:30px;height:30px;border-radius:8px;}
  .brand-mark span{font-size:12px;}
  .brand-txt{display:none;}
  .nav{flex-direction:row;flex:1;min-width:0;overflow-x:auto;gap:2px;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav-item{height:32px;padding:0 9px;font-size:12px;border-radius:8px;flex:0 0 auto;}
  .nav-item .ic{display:none;}
  .nav-item.active::before{display:none;}
  .pill{margin-left:5px;height:16px;min-width:16px;font-size:9.5px;}
  .rail-foot{display:none;}
  .nav-item.only-mobile{display:flex;}

  .topbar{height:auto;padding:7px 12px;gap:6px;}
  .crumb{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip{height:24px;padding:0 8px;font-size:10px;gap:4px;}
  .chip b{font-size:10.5px;}

  .page{padding:14px 12px 24px;}
  .hero{padding:18px 16px;flex-direction:column;align-items:flex-start;gap:14px;}
  .hero h1{font-size:19px;line-height:1.35;}
  .hero p{font-size:11.5px;}
  .hero-side{gap:20px;}
  .hero-stat b{font-size:19px;}
  .hero-stat span{font-size:9px;}
  .grid-2,.start-grid{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:1fr 1fr;gap:9px;}
  .stat{padding:12px 13px;}
  .stat b{font-size:18px;}
  .module-card{padding:16px;}
  .module-card .top{margin-bottom:16px;}
  .mod-head{flex-direction:column;align-items:flex-start;gap:10px;}
  .mod-head > div:last-child{text-align:left !important;}
  .mod-title{font-size:20px;}
  .mod-desc{font-size:11.5px;}

  .pbar{padding:9px 12px;gap:9px;}
  .pbar-meta{font-size:10.5px;}
  .tag{font-size:9.5px;padding:2px 6px;}
  .q-area{padding:12px;}
  .q-area > .q-inner{margin:0 auto;}
  .q-card{padding:16px 16px 18px;min-height:0;border-radius:14px;}
  .q-word{font-size:28px;}
  .q-cn{font-size:12.5px;}
  .q-ask{font-size:12px;}
  .opts{grid-template-columns:1fr;gap:8px;margin-top:14px;}
  .opt{min-height:50px;padding:9px 12px;}
  .opt .txt{font-size:17px;}
  .fill-input{height:50px;font-size:19px;}
  .feedback{padding:13px 14px;}
  .fb-ans{font-size:11.5px;line-height:1.8;}
  .fb-ans .mono{font-size:14px;}
  .q-foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));gap:8px;}
  .q-foot .btn.next{height:44px;min-width:112px;font-size:13.5px;}
  .inline-next{display:block;}
  .inline-next .btn{width:100%;height:46px;font-size:14px;}
  .q-foot .left{font-size:10px;line-height:1.5;}
  .btn.next{min-width:104px;height:36px;}

  .list-row{display:flex !important;flex-wrap:wrap;align-items:center;gap:5px 12px;padding:12px 14px;}
  .list-row.head{display:none !important;}
  .lr-de{flex:1 1 100%;font-size:15px;}
  .lr-ans{flex:1 1 auto;font-size:13px;}
  .lr-cn{flex:1 1 100%;color:var(--dim);font-size:11px;}
  .lr-num{text-align:left;font-size:11px;}
  .lr-act{margin-left:auto;}
  .list-row > div > .badge{display:inline-flex;}
  .filters{gap:6px;}
  .search{width:100%;margin-left:0;}

  .drawer{width:100%;}
  .modal{width:calc(100% - 28px);padding:18px;}
  .qr-box img{width:min(68vw,300px);height:min(68vw,300px);}
}

/* 卡片内的「继续」：桌面隐藏，手机上作为主按钮 */
@media (min-width:901px){
  .inline-next{display:none;}
}
.inline-next{margin-top:16px;}

</style>
</head>
<body>
<div id="app">

  <!-- ===================== 左侧栏 ===================== -->
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark"><span>DE</span></div>
      <div class="brand-txt">
        <div class="brand-t">德语刷词</div>
        <div class="brand-s">Deutsch&nbsp;Drill</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item" data-nav="home"><i class="ic">◆</i><span>概览</span></button>
      <button class="nav-item" data-nav="verbs"><i class="ic">Ⅰ</i><span>词汇 · 103</span></button>
      <button class="nav-item" data-nav="colloc"><i class="ic">Ⅱ</i><span>搭配 · 236</span></button>
      <button class="nav-item only-mobile" data-nav="mistakes"><i class="ic">✕</i><span>错题本</span><b class="pill" id="navWrong">0</b></button>
      <button class="nav-item" data-nav="browse"><i class="ic">≡</i><span>总表</span></button>
      <button class="nav-item" data-nav="notes"><i class="ic">✎</i><span>笔记</span><b class="pill" id="navNotes">0</b></button>
    </nav>

    <div class="rail-foot">
      <button class="mistake-card" id="mistakeCard">
        <span class="mc-row"><i>✕</i>错题本<b class="mc-num" id="cardWrong">0</b></span>
        <span class="mc-sub" id="cardSub">还没有错题</span>
        <span class="mc-bar"><i id="cardBar" style="width:0%"></i></span>
      </button>
      <button class="rail-act" id="qrBtn"><span>手机 / 平板扫码</span><i>▣</i></button>
      <div class="rail-box">
        <div class="rail-box-h">
          <span>严格复习</span>
          <button class="switch on" id="strictSwitch" role="switch" aria-checked="true"><i></i></button>
        </div>
        <p class="rail-box-p">答错的词须连续复习 <b>3</b> 遍才能进入下一个词，期间不会解锁新词。</p>
      </div>
      <div class="rail-mini" id="railMini"></div>
    </div>
  </aside>

  <!-- ===================== 右侧主区 ===================== -->
  <main class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">概览</div>
      <div class="topstats" id="topstats"></div>
    </header>

    <div class="stage">

<script>
/* =========================================================
   德语刷词 · Deutsch Drill  —  app.js
   ========================================================= */
(function () {
  'use strict';

  var D = window.DE_DATA;
  var VERBS = D.VERBS, COLLOC_V = D.COLLOC_V, COLLOC_A = D.COLLOC_A;
  var GROUP_NAMES = D.GROUP_NAMES, PREP_POOL = D.PREP_POOL;

  /* ---------------------------------------------------------
     1. 数据装配
     --------------------------------------------------------- */
  function parseAns(str) {
    return String(str).split('|').map(function (s) {
      var p = s.split(':');
      return { p: p[0].trim(), c: (p[1] || '').trim() };
    });
  }
  function ansLabel(a) { return a.c ? a.p + ' (' + a.c + ')' : a.p; }

  var ENTRIES = [];
  VERBS.forEach(function (v, i) {
    var e = {
      id: 'v' + i,
      mod: 'verbs',
      head: v[0],
      praes: v[1], praet: v[2], perf: v[3],
      cn: v[4],
      sein: !!v[5],
      group: v[6],
      forms: {
        praes: { key: 'praes', name: '现在时', ask: '第三人称单数（er / sie / es）的现在时变位', ans: [v[1]] },
        praet:  { key: 'praet',  name: '过去式', ask: '过去式（Präteritum）', ans: v[2].split('/') },
        perf:   { key: 'perf',   name: '现在完成时', ask: '第二分词（Partizip II）', ans: v[3].split('/') }
      }
    };
    ENTRIES.push(e);
  });
  function addColloc(list, sub) {
    list.forEach(function (c, i) {
      ENTRIES.push({
        id: 'c' + (sub === 'a' ? 'a' : 'v') + i,
        mod: 'colloc',
        sub: sub,
        head: c[0],
        cn: c[1],
        ans: parseAns(c[2]),
        pattern: c[3],
        forms: { colloc: { key: 'colloc', name: '介词搭配', ask: '选择 / 填出正确的介词搭配', ans: [c[2]] } }
      });
    });
  }
  addColloc(COLLOC_V, 'v');
  addColloc(COLLOC_A, 'a');

  var BY_ID = {};
  ENTRIES.forEach(function (e) { BY_ID[e.id] = e; });
  var VERB_ENTRIES = ENTRIES.filter(function (e) { return e.mod === 'verbs'; });
  var COLLOC_ENTRIES = ENTRIES.filter(function (e) { return e.mod === 'colloc'; });

  /* 收集所有出现过的 介词+格 */
  var PREP_PAIRS = [];
  (function () {
    var seen = {};
    COLLOC_ENTRIES.forEach(function (e) {
      e.ans.forEach(function (a) {
        if (a.p === 'als') return;
        var k = a.p + ':' + a.c;
        if (!seen[k]) { seen[k] = 1; PREP_PAIRS.push(a); }
      });
    });
  })();

  /* ---------------------------------------------------------
     2. 持久化
     --------------------------------------------------------- */
  var LS_KEY = 'de_drill_v1';
  var DB = {
    items: {},   /* id -> {w,r,rev,mastered,revLeft,ts} */
    notes: {},   /* id -> text */
    stats: { answered: 0, correct: 0, days: {} },
    settings: { strict: true, size: 20 }
  };
  function storageOK() {
    try {
      localStorage.setItem('__dd_t', '1');
      localStorage.removeItem('__dd_t');
      return true;
    } catch (err) { return false; }
  }
  var STORAGE_OK = storageOK();

  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        DB.items = o.items || {};
        DB.notes = o.notes || {};
        DB.stats = o.stats || DB.stats;
        DB.stats.days = DB.stats.days || {};
        DB.settings = Object.assign(DB.settings, o.settings || {});
      }
    } catch (err) { console.warn('load failed', err); }
  }
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
      catch (err) { console.warn('save failed', err); }
    }, 120);
  }
  function rec(id) {
    if (!DB.items[id]) DB.items[id] = { w: 0, r: 0, rev: 0, mastered: false, revLeft: 0, ts: 0 };
    return DB.items[id];
  }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function todayCount() { return DB.stats.days[todayKey()] || 0; }
  function bumpDay() {
    var k = todayKey();
    DB.stats.days[k] = (DB.stats.days[k] || 0) + 1;
  }

  /* ---------------------------------------------------------
     3. 工具
     --------------------------------------------------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function norm(s) {
    return String(s == null ? '' : s)
      .toLowerCase().trim()
      .replace(/\s+/g, ' ')
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .replace(/^(es|er|sie)\s+/, '')
      .replace(/^(hat|ist|haben|sind)\s+/, '');
  }
  function stripParen(s) { return String(s).replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim(); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 1800);
  }

  /* ---------------------------------------------------------
     4. 出题
     --------------------------------------------------------- */
  function otherFormKeys(e) {
    return e.mod === 'verbs' ? ['praes', 'praet', 'perf'] : ['colloc'];
  }

  function buildOptions(entry, formKey) {
    if (entry.mod === 'colloc') {
      var correct = entry.ans[0];
      var banned = {};
      entry.ans.forEach(function (a) { banned[a.p] = 1; });
      var pool = PREP_PAIRS.filter(function (a) { return !banned[a.p]; });
      /* 优先同格、常见介词 */
      var sameCase = pool.filter(function (a) { return a.c === correct.c; });
      var others = pool.filter(function (a) { return a.c !== correct.c; });
      var chosen = [];
      var used = {};
      function take(list, n) {
        var l = shuffle(list.filter(function (a) { return !used[a.p]; }));
        for (var i = 0; i < l.length && chosen.length < n; i++) {
          used[l[i].p] = 1; chosen.push(l[i]);
        }
      }
      take(sameCase, 2);
      take(others, 3);
      if (chosen.length < 3) take(pool, 3);
      var opts = [correct].concat(chosen.slice(0, 3)).map(function (a) {
        return { label: ansLabel(a), correct: a.p === correct.p && a.c === correct.c };
      });
      return shuffle(opts);
    }

    /* 动词：1 个同词其他时态（易混） + 2 个同组同形 */
    var f = entry.forms[formKey];
    var correctVal = f.ans[0];
    var correctNorm = {};
    f.ans.forEach(function (a) { correctNorm[norm(a)] = 1; });

    var sameVerb = [];
    otherFormKeys(entry).forEach(function (k) {
      if (k === formKey) return;
      entry.forms[k].ans.forEach(function (v) {
        if (!correctNorm[norm(v)]) sameVerb.push(v);
      });
    });

    var pool2 = [];
    VERB_ENTRIES.forEach(function (e) {
      if (e.id === entry.id) return;
      e.forms[formKey].ans.forEach(function (v) {
        if (correctNorm[norm(v)]) return;
        pool2.push({ v: v, e: e });
      });
    });
    var sameGroup = pool2.filter(function (p) { return p.e.group === entry.group; });
    var used = {};
    var out = [correctVal];
    used[norm(correctVal)] = 1;

    if (sameVerb.length) {
      var sv = pick(sameVerb);
      out.push(sv); used[norm(sv)] = 1;
    }
    var sources = [shuffle(sameGroup), shuffle(pool2.filter(function (p) { return p.e.group !== entry.group; }))];
    for (var s = 0; s < sources.length && out.length < 4; s++) {
      for (var i = 0; i < sources[s].length && out.length < 4; i++) {
        var v = sources[s][i].v;
        if (used[norm(v)]) continue;
        used[norm(v)] = 1; out.push(v);
      }
    }
    return shuffle(out.map(function (v) {
      return { label: v, correct: norm(v) === norm(correctVal) || !!correctNorm[norm(v)] };
    }));
  }

  function makeQuestion(card) {
    var e = BY_ID[card.eid];
    if (!e) return null;
    var f = e.forms[card.formKey] || e.forms[Object.keys(e.forms)[0]];
    return {
      entry: e, form: f, card: card,
      options: buildOptions(e, f.key)
    };
  }

     5. 会话
     --------------------------------------------------------- */
  var S = {
    view: 'home',
    mod: 'verbs',
    mode: 'mc',
    sess: null,
    drawerEid: null,
    mistakeFilter: 'all',
    browseMod: 'verbs',
    browseQ: ''
  };

  function buildDeck(mod, onlyWrong) {
    var cards = [];
    var src = ENTRIES.filter(function (e) {
      if (e.mod !== mod) return false;
      if (!onlyWrong) return true;
      var r = DB.items[e.id];
      return r && r.w > 0 && !(r.mastered && r.revLeft === 0);
    });
    src.forEach(function (e) {
      if (e.mod === 'verbs') {
        ['praes', 'praet', 'perf'].forEach(function (k) {
          cards.push({ eid: e.id, formKey: k });
        });
      } else {
        cards.push({ eid: e.id, formKey: 'colloc' });
      }
    });
    /* 优先：待复习 > 错过 > 其余 */
    cards = shuffle(cards);
    cards.sort(function (a, b) {
      var ra = DB.items[a.eid] || { w: 0, revLeft: 0, mastered: false };
      var rb = DB.items[b.eid] || { w: 0, revLeft: 0, mastered: false };
      var sa = ra.revLeft > 0 ? 0 : (ra.w > 0 && !ra.mastered ? 1 : 2);
      var sb = rb.revLeft > 0 ? 0 : (rb.w > 0 && !rb.mastered ? 1 : 2);
      return sa - sb;
    });
    var size = DB.settings.size;
    if (onlyWrong) size = cards.length;
    else if (size && size !== 'all') cards = cards.slice(0, size);
    return cards;
  }

  function startSession(mod, mode, onlyWrong) {
    var deck = buildDeck(mod, !!onlyWrong);
    if (!deck.length) {
      toast(onlyWrong ? '这个模块还没有错题，先练一轮吧' : '没有可练的题目');
      return;
    }
    S.sess = {
      mod: mod, mode: mode, deck: deck, i: 0,
      cur: null, q: null, answered: false, res: null,
      pending: [], ok: 0, bad: 0, wrongSet: {},
      total: deck.length, done: false
    };
    serveNext();
    go('practice');
  }

  function serveNext() {
    var s = S.sess;
    if (!s) return;
    if (s.pending.length) {
      s.cur = s.pending.shift();
    } else if (s.i < s.deck.length) {
      s.cur = s.deck[s.i++];
    } else {
      s.done = true;
      s.cur = null;
      renderPractice();
      return;
    }
    s.q = makeQuestion(s.cur);
    s.answered = false;
    s.res = null;
    renderPractice();
    refreshChrome();
  }

  function answerMC(idx) {
    var s = S.sess;
    if (!s || s.answered || !s.q) return;
    var opt = s.q.options[idx];
    if (!opt) return;
    judge(opt.correct, opt.label, idx);
  }

  function judge(ok, givenLabel, optIdx) {
    var s = S.sess;
    s.answered = true;
    var e = s.q.entry;
    var r = rec(e.id);
    r.ts = Date.now();
    DB.stats.answered++;
    bumpDay();
    if (ok) {
      DB.stats.correct++;
      r.r++;
      s.ok++;
      if (s.cur.review) {
        r.rev++;
        r.revLeft = Math.max(0, s.pending.length);
        if (s.pending.length === 0) { r.mastered = true; r.revLeft = 0; }
      }
      s.res = { ok: true, given: givenLabel, optIdx: optIdx };
    } else {
      r.w++;
      r.mastered = false;
      s.bad++;
      s.wrongSet[e.id] = 1;
      s.res = { ok: false, given: givenLabel, optIdx: optIdx, expect: correctText(s.q) };
      if (DB.settings.strict) {
        queueReviews(s.cur);
      }
    }
    save();
    renderPractice();
    refreshChrome();
  }

  function correctText(q) {
    var e = q.entry;
    if (e.mod === 'colloc') return e.ans.map(ansLabel).join(' / ');
    return q.form.ans.join(' / ');
  }

  function queueReviews(card) {
    var s = S.sess;
    var e = BY_ID[card.eid];
    var keys = otherFormKeys(e);
    var start = Math.max(0, keys.indexOf(card.formKey));
    var list = [];
    for (var k = 0; k < 3; k++) {
      list.push({
        eid: card.eid,
        formKey: keys[(start + 1 + k) % keys.length],
        review: true, step: k + 1, total: 3
      });
    }
    s.pending = list;
    var r = rec(card.eid);
    r.revLeft = 3;
  }

  function submitFill() {
    var s = S.sess;
    if (!s || s.answered || !s.q) return;
    var inp = $('#fillInput');
    if (!inp) return;
    var val = inp.value.trim();
    var e = s.q.entry;

    if (e.mod === 'colloc') {
      var caseBtn = $('.case-btn.on');
      var c = caseBtn ? caseBtn.dataset.c : '';
      var p = val.toLowerCase().replace(/[()\s]/g, '');
      if (!p) { toast('请先填写介词'); return; }
      if (!c) { toast('请再选择格（A / D）'); return; }
      var exact = e.ans.some(function (a) { return a.p === p && a.c === c; });
      var prepOK = e.ans.some(function (a) { return a.p === p; });
      var caseOK = e.ans.some(function (a) { return a.c === c; });
      var given = p + ' (' + c + ')';
      judge(exact, given, -1);
      if (!exact && prepOK) {
        s.res.hint = '介词对了，格用错了 —— 注意支配关系。';
        renderPractice();
      } else if (!exact && caseOK) {
        s.res.hint = '格判断对了，介词选错了。';
        renderPractice();
      }
      return;
    }

    /* 动词填空 */
    var forms = s.q.form;
    var ok = forms.ans.some(function (a) { return norm(a) === norm(val); });
    /* 允许 现在时 输入完整句子形式，如 "er spricht" 已由 norm 处理 */
    judge(ok, val, -1);
  }

    var head =
      '<div class="practice-wrap">' +

          '<span class="pbar-meta"><b>' + idxShown + '</b> / ' + s.total + '</span>' +
          '<div class="pbar-track"><div class="pbar-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="pbar-tags">' + tags + '</div>' +
          '<button class="icon-btn" id="quitPractice" title="结束本轮">✕</button>' +
        '</div>' +
        '<div class="q-area"><div class="q-inner">';

    var body = '<div class="q-card">' +
      '<div class="q-kicker">' +
        '<span class="k">' + (isV ? q.form.name : (e.sub === 'a' ? '形容词搭配' : '动词搭配')) + '</span>' +
        '<span class="sep"></span>' +
        '<span class="m">' + (s.mode === 'mc' ? '选择题' : '填空题') + '</span>' +
        '<span style="flex:1"></span>' +
        '<button class="icon-btn" id="noteBtn" title="记笔记">✎</button>' +
      '</div>';

    if (isV) {
      body += '<div class="q-word">' + esc(e.head) + '</div>' +
        '<div class="q-cn">' + esc(e.cn) + '</div>' +
        '<div class="q-ask">请选出 / 写出它的 <b>' + q.form.name + '</b>：' + esc(q.form.ask) + '</div>';
    } else {
      body += '<div class="q-word" style="font-size:32px">' + esc(e.head) + '</div>' +
        '<div class="q-cn">' + esc(e.cn) + '</div>' +
        '<div class="q-ask">它要求哪个 <b>介词</b>，支配哪个 <b>格</b>？</div>';
    }

    if (s.mode === 'mc') {
      body += '<div class="opts">';
      q.options.forEach(function (o, i) {
        var cls = 'opt';
        var mark = '';
        if (s.answered) {
          if (o.correct) { cls += ' correct'; mark = '<span class="mark">✓</span>'; }
          else if (s.res.optIdx === i) { cls += ' wrong'; mark = '<span class="mark">✕</span>'; }
          else cls += ' dim';
        }
        body += '<button class="' + cls + '" data-opt="' + i + '"' + (s.answered ? ' disabled' : '') + '>' +
          '<span class="key">' + 'ABCD'[i] + '</span>' +
          '<span class="txt">' + esc(o.label) + '</span>' + mark + '</button>';
      });
      body += '</div>';
    } else {
      var ph = isV ? '输入 ' + q.form.name + ' 形式…' : '输入介词，如 auf';
      body += '<div class="fill-box">' +
        '<div class="fill-row"><input class="fill-input' +
          (s.answered ? (s.res.ok ? ' ok' : ' no') : '') + '" id="fillInput" placeholder="' + esc(ph) + '" autocomplete="off" autocapitalize="off" spellcheck="false"' +
          (s.answered ? ' disabled' : '') + ' value="' + (s.answered && s.res.given ? esc(s.res.given.replace(/\s*\(.*\)$/, '')) : '') + '"></div>' +
        (isV
          ? '<div class="umlauts">' + ['ä', 'ö', 'ü', 'ß'].map(function (c) {
              return '<button class="um-btn" data-um="' + c + '">' + c + '</button>';
            }).join('') + '</div>'
          : '<div class="case-pick"><span class="lb">支配的格</span>' +
            '<button class="case-btn" data-c="A">A</button>' +
            '<button class="case-btn" data-c="D">D</button></div>') +
        '</div>';
      if (!s.answered) {
        body += '<div class="fill-actions"><button class="btn primary" id="fillSubmit">提交答案</button></div>';
      }
    }

    /* 反馈 */
    if (s.answered) {
      body += renderFeedback(s, q);
      body += '<div class="inline-next"><button class="btn primary" id="nextBtn2">继续 →</button></div>';
    }
    body += '</div>'; /* /q-card */

    var foot = '<div class="q-foot">' +
      '<div class="left">' + (revLeft && !s.answered
        ? '错词锁：还需复习 <b>' + revLeft + '</b> 次才放行'
        : (s.answered ? (s.res.ok ? '答对了 · 点击右侧继续' : (DB.settings.strict ? '已加入错题本 · 需复习 3 遍' : '已加入错题本')) : '答完题后点击「继续」进入下一题')) + '</div>' +
      '<div class="spacer"></div>' +
      '<button class="btn' + (s.answered ? ' primary' : '') + ' next" id="nextBtn"' + (s.answered ? '' : ' disabled') + '>' +
        (s.answered ? '继续 →' : '继续') + '</button>' +
      '</div>';

    host.innerHTML = head + body + '</div></div>' + foot + '</div>';

    wirePractice();

    if (s.answered) {
      var qa = $('.q-area');
      if (qa) requestAnimationFrame(function () { qa.scrollTop = qa.scrollHeight; });
    }
  }

  function renderFeedback(s, q) {
    var e = q.entry;
    var okc = s.res.ok ? 'ok' : 'no';
    var title = s.res.ok ? '答对了' : '答错了';
    var html = '<div class="feedback show ' + okc + '">' +
      '<div class="fb-head"><span class="dot"></span>' + title + '</div>';

    if (!s.res.ok) {
      html += '<div class="fb-ans">正确答案：<span class="mono">' + esc(correctText(q)) + '</span>' +
        (s.res.given ? '<br>你的答案：<span style="color:#d99">' + esc(s.res.given) + '</span>' : '') +
        (s.res.hint ? '<br><span style="color:var(--gold)">' + esc(s.res.hint) + '</span>' : '') +
        '</div>';
    } else if (s.res.given) {
      html += '<div class="fb-ans">你的答案：<span class="mono">' + esc(s.res.given) + '</span></div>';
    }

    if (e.mod === 'verbs') {
      html += '<div class="fb-ans">' +
        '<b>完整变位</b>　' + esc(e.head) + ' · ' + esc(e.praes) + ' · ' + esc(e.praet) + ' · ' +
        (e.sein ? 'ist ' : 'hat ') + esc(e.perf) + '　—— ' + esc(e.cn) +
        '<br><span style="color:var(--dim);font-size:11px">变音组 ' + e.group + '：' + esc(GROUP_NAMES[e.group]) + '</span>' +
        '</div>';
    } else {
      html += '<div class="fb-ans"><b>完整搭配</b>　<span class="mono" style="font-size:15px">' + esc(e.pattern) + '</span>' +
        '<br><span style="color:var(--dim);font-size:11px">' + esc(e.cn) + '</span></div>';
    }

    var note = (DB.notes[e.id] || '').trim();
    if (note) {
      html += '<div class="fb-note"><span class="k">笔记</span><span>' + esc(note) + '</span></div>';
    }
    html += '</div>';
    return html;
  }

  function wirePractice() {
    var s = S.sess;
    $$('#view-practice [data-opt]').forEach(function (b) {
      b.addEventListener('click', function () { answerMC(parseInt(b.dataset.opt, 10)); });
    });
    var fs = $('#fillSubmit');
    if (fs) fs.addEventListener('click', submitFill);
    var fi = $('#fillInput');
    if (fi) {
      fi.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); submitFill(); }
      });
      if (!s.answered) setTimeout(function () { fi.focus(); }, 40);
    }
    $$('.um-btn').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.preventDefault();
        var inp = $('#fillInput');
        if (!inp || inp.disabled) return;
        var pos = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
        inp.value = inp.value.slice(0, pos) + b.dataset.um + inp.value.slice(inp.selectionEnd == null ? pos : inp.selectionEnd);
        inp.focus();
        inp.selectionStart = inp.selectionEnd = pos + 1;
      });
    });
    $$('.case-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        $$('.case-btn').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
    });
    var nb = $('#noteBtn');
    if (nb) nb.addEventListener('click', function () { openDrawer(s.q.entry.id); });
    var nx = $('#nextBtn');
    if (nx) nx.addEventListener('click', function () { if (s.answered) serveNext(); });
    var nx2 = $('#nextBtn2');
    if (nx2) nx2.addEventListener('click', function () { if (s.answered) serveNext(); });
    var qp = $('#quitPractice');
    if (qp) qp.addEventListener('click', function () {
      if (s.i > 0 || s.answered) quitConfirm();
      else { S.sess = null; go('home'); }
    });
  }

  function quitConfirm() {
    /* 无弹窗，直接回首页并保留进度统计 */
    S.sess = null;
    go('home');
    toast('已结束本轮，进度已保存');
  }

  function renderResult() {
    var s = S.sess;
    var acc = s.total ? Math.round((s.ok / (s.ok + s.bad || 1)) * 100) : 0;
    var wrongN = Object.keys(s.wrongSet).length;
    $('#view-practice').innerHTML =
      '<div class="practice-wrap"><div class="q-area"><div class="q-inner"><div class="result">' +
        '<div class="big" style="color:var(--gold-2)">' + acc + '%</div>' +
        '<div class="lb">本轮正确率</div>' +
        '<div class="result-grid">' +
          '<div class="r"><span>答对</span><b style="color:var(--green)">' + s.ok + '</b></div>' +
          '<div class="r"><span>答错</span><b style="color:var(--red)">' + s.bad + '</b></div>' +
          '<div class="r"><span>错词</span><b>' + wrongN + '</b></div>' +
        '</div>' +
        '<div style="display:flex;gap:10px;justify-content:center">' +
          '<button class="btn primary" id="againBtn">再来一轮</button>' +
          '<button class="btn" id="toMistakes">看错题本</button>' +
          '<button class="btn ghost" id="toHome">回到概览</button>' +
        '</div>' +
      '</div></div></div></div>';
    $('#againBtn').addEventListener('click', function () { startSession(s.mod, s.mode, false); });
    $('#toMistakes').addEventListener('click', function () { go('mistakes'); });
    $('#toHome').addEventListener('click', function () { S.sess = null; go('home'); });
    refreshChrome();
  }

  /* ---------------------------------------------------------
     10. 错题本
     --------------------------------------------------------- */
  function mistakeList() {
    var arr = ENTRIES.filter(function (e) {
      var r = DB.items[e.id];
      return r && r.w > 0;
    });
    return arr.sort(function (a, b) {
      var ra = DB.items[a.id], rb = DB.items[b.id];
      var sa = (ra.mastered && ra.revLeft === 0) ? 1 : 0;
      var sb = (rb.mastered && rb.revLeft === 0) ? 1 : 0;
      if (sa !== sb) return sa - sb;
      return (rb.ts || 0) - (ra.ts || 0);
    });
  }

  function renderMistakes() {
    var all = mistakeList();
    var f = S.mistakeFilter;
    var list = all.filter(function (e) {
      var r = DB.items[e.id];
      var done = r.mastered && r.revLeft === 0;
      if (f === 'todo') return !done;
      if (f === 'done') return done;
      return true;
    });

    var todoN = all.filter(function (e) { var r = DB.items[e.id]; return !(r.mastered && r.revLeft === 0); }).length;

    var rows = list.map(function (e) {
      var r = DB.items[e.id];
      var done = r.mastered && r.revLeft === 0;
      var ansTxt = e.mod === 'colloc' ? e.ans.map(ansLabel).join(' / ') : (e.praes + ' · ' + e.praet + ' · ' + e.perf);
      var pct = done ? 100 : Math.round((3 - (r.revLeft || 0)) / 3 * 100);
      return '<div class="list-row">' +
        '<div class="lr-de">' + esc(e.head) + '<small>' + (e.mod === 'verbs' ? '动词' : (e.sub === 'a' ? '形容词搭配' : '动词搭配')) + '</small></div>' +
        '<div class="lr-ans">' + esc(ansTxt) + '</div>' +
        '<div class="lr-cn">' + esc(e.cn) + '</div>' +
        '<div class="lr-num">' + r.w + ' / ' + (r.rev || 0) + '</div>' +
        '<div><div class="badge ' + (done ? 'done' : (r.revLeft > 0 ? 'rev' : 'warn')) + '">' +
          (done ? '已过关' : (r.revLeft > 0 ? '需复习 ' + r.revLeft : '待复习')) + '</div>' +
          '<div class="mini-bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<div class="lr-act"><button class="icon-btn" data-note="' + e.id + '" title="笔记">✎</button>' +
          '<button class="icon-btn" data-prac="' + e.id + '" title="单练这个词">▷</button></div>' +
        '</div>';
    }).join('');

    $('#view-mistakes').innerHTML =
      '<div class="scroll"><div class="page">' +
        '<div class="mod-head"><div>' +
          '<div class="mod-tag">Fehlerheft</div>' +
          '<h1 class="mod-title">错题本</h1>' +
          '<p class="mod-desc">共 ' + all.length + ' 个错过的词，其中 ' + todoN + ' 个还没通过三遍复习。复习次数会一直累计。</p>' +
        '</div><div style="text-align:right"><div class="hero-stat"><b>' + todoN + '</b><span>待过关</span></div></div></div>' +
        '<div class="filters">' +
          '<button class="filter ' + (f === 'all' ? 'on' : '') + '" data-f="all">全部</button>' +
          '<button class="filter ' + (f === 'todo' ? 'on' : '') + '" data-f="todo">待复习 ' + todoN + '</button>' +
          '<button class="filter ' + (f === 'done' ? 'on' : '') + '" data-f="done">已过关</button>' +
          '<button class="btn sm ghost" id="pracAllWrong" style="margin-left:auto">练全部错题</button>' +
        '</div>' +
        (list.length
          ? '<div class="list"><div class="list-row head"><div>词条</div><div>正确答案</div><div>含义</div><div style="text-align:center">错次/复习</div><div>复习进度</div><div style="text-align:right">操作</div></div>' + rows + '</div>'
          : '<div class="list"><div class="empty"><span class="em">✓</span>这里还空着</div></div>') +
      '</div></div>';

    $$('#view-mistakes [data-f]').forEach(function (b) {
      b.addEventListener('click', function () { S.mistakeFilter = b.dataset.f; renderMistakes(); });
    });
    $$('#view-mistakes [data-note]').forEach(function (b) {
      b.addEventListener('click', function () { openDrawer(b.dataset.note); });
    });
    $$('#view-mistakes [data-prac]').forEach(function (b) {
      b.addEventListener('click', function () {
        var e = BY_ID[b.dataset.prac];
        startSession(e.mod, S.mode, true);
      });
    });
    var pa = $('#pracAllWrong');
    if (pa) pa.addEventListener('click', function () {
      var hasV = all.some(function (e) { return e.mod === 'verbs'; });
      startSession(hasV ? 'verbs' : 'colloc', 'mc', true);
    });
  }

  /* ---------------------------------------------------------
     11. 总表
     --------------------------------------------------------- */
  function renderBrowse() {
    var mod = S.browseMod;
    var q = S.browseQ.trim().toLowerCase();
    var src = (mod === 'verbs' ? VERB_ENTRIES : COLLOC_ENTRIES).filter(function (e) {
      if (!q) return true;
      return (e.head + ' ' + e.cn + ' ' + (e.pattern || '') + ' ' + (e.praet || '')).toLowerCase().indexOf(q) >= 0;
    });

    var head, rows;
    if (mod === 'verbs') {
      head = '<div class="list-row head" style="grid-template-columns:1.1fr 1fr 1fr 1.15fr 1.1fr 76px">' +
        '<div>不定式</div><div>现在时(er)</div><div>过去式</div><div>现在完成时</div><div>含义</div><div style="text-align:right">笔记</div></div>';
      rows = src.map(function (e) {
        var r = DB.items[e.id] || {};
        var hasNote = (DB.notes[e.id] || '').trim();
        return '<div class="list-row" style="grid-template-columns:1.1fr 1fr 1fr 1.15fr 1.1fr 76px">' +
          '<div class="lr-de">' + esc(e.head) + '<small>' + esc(GROUP_NAMES[e.group]) + '</small></div>' +
          '<div class="lr-ans">' + esc(e.praes) + '</div>' +
          '<div class="lr-ans">' + esc(e.praet) + '</div>' +
          '<div class="lr-ans">' + (e.sein ? 'ist ' : 'hat ') + esc(e.perf) + '</div>' +
          '<div class="lr-cn">' + esc(e.cn) +
            (r.w ? ' <span class="badge warn" style="margin-left:6px">错' + r.w + '</span>' : '') + '</div>' +
          '<div class="lr-act"><button class="icon-btn" data-note="' + e.id + '">' + (hasNote ? '✎' : '＋') + '</button></div>' +
          '</div>';
      }).join('');
    } else {
      head = '<div class="list-row head" style="grid-template-columns:1fr 1.9fr 1.5fr 76px">' +
        '<div>词条</div><div>完整搭配</div><div>含义</div><div style="text-align:right">笔记</div></div>';
      rows = src.map(function (e) {
        var r = DB.items[e.id] || {};
        var hasNote = (DB.notes[e.id] || '').trim();
        return '<div class="list-row" style="grid-template-columns:1fr 1.9fr 1.5fr 76px">' +
          '<div class="lr-de">' + esc(e.head) + '<small>' + (e.sub === 'a' ? '形容词' : '动词') + '</small></div>' +
          '<div class="lr-ans">' + esc(e.pattern) +
            ' <em>' + esc(e.ans.map(ansLabel).join(' / ')) + '</em></div>' +
          '<div class="lr-cn">' + esc(e.cn) +
            (r.w ? ' <span class="badge warn" style="margin-left:6px">错' + r.w + '</span>' : '') + '</div>' +
          '<div class="lr-act"><button class="icon-btn" data-note="' + e.id + '">' + (hasNote ? '✎' : '＋') + '</button></div>' +
          '</div>';
      }).join('');
    }

    $('#view-browse').innerHTML =
      '<div class="scroll"><div class="page">' +
        '<div class="mod-head"><div>' +
          '<div class="mod-tag">Übersicht</div>' +
          '<h1 class="mod-title">总表</h1>' +
          '<p class="mod-desc">完整词表，可搜索、可随手记笔记。' + (mod === 'verbs' ? '已按要求省略命令式一列。' : '') + '</p>' +
        '</div><div style="text-align:right"><div class="hero-stat"><b>' + src.length + '</b><span>条</span></div></div></div>' +
        '<div class="filters">' +
          '<div class="seg"><button class="' + (mod === 'verbs' ? 'on' : '') + '" data-bmod="verbs">词汇 103</button>' +
          '<button class="' + (mod === 'colloc' ? 'on' : '') + '" data-bmod="colloc">搭配 ' + COLLOC_ENTRIES.length + '</button></div>' +
          '<input class="search" id="browseSearch" placeholder="搜索德语 / 中文…" value="' + esc(S.browseQ) + '">' +
        '</div>' +
        '<div class="list">' + head + (rows || '<div class="empty">没有匹配项</div>') + '</div>' +
      '</div></div>';

    $$('#view-browse [data-bmod]').forEach(function (b) {
      b.addEventListener('click', function () { S.browseMod = b.dataset.bmod; renderBrowse(); });
    });
    var si = $('#browseSearch');
    si.addEventListener('input', function () {
      S.browseQ = si.value;
      var v = si.value;
      renderBrowse();
      var n = $('#browseSearch');
      n.focus();
      n.setSelectionRange(v.length, v.length);
    });
    $$('#view-browse [data-note]').forEach(function (b) {
      b.addEventListener('click', function () { openDrawer(b.dataset.note); });
    });
  }

  /* ---------------------------------------------------------
     12. 笔记
     --------------------------------------------------------- */
  function renderNotes() {
    var keys = Object.keys(DB.notes).filter(function (k) { return (DB.notes[k] || '').trim() && BY_ID[k]; });
    keys.sort(function (a, b) { return (DB.items[b] && DB.items[b].ts || 0) - (DB.items[a] && DB.items[a].ts || 0); });

    var cards = keys.map(function (k) {
      var e = BY_ID[k];
      var txt = DB.notes[k];
      return '<div class="start-card" style="cursor:pointer" data-note="' + k + '">' +
        '<h4><span style="font-family:var(--serif);font-size:16px">' + esc(e.head) + '</span>' +
          '<span style="font-size:11px;color:var(--muted);font-weight:400">' + esc(e.cn) + '</span></h4>' +
        '<p style="white-space:pre-wrap;color:var(--text-2);font-size:12px;line-height:1.8;max-height:96px;overflow:hidden">' + esc(txt) + '</p>' +
        '<div style="font-size:10px;color:var(--dim)">' + (e.mod === 'verbs' ? '词汇' : '搭配') + ' · 点击编辑</div>' +
        '</div>';
    }).join('');

    $('#view-notes').innerHTML =
      '<div class="scroll"><div class="page">' +
        '<div class="mod-head"><div>' +
          '<div class="mod-tag">Notizen</div>' +
          '<h1 class="mod-title">笔记</h1>' +
          '<p class="mod-desc">所有笔记集中在这里。练习时点卡片右上角的 ✎ 随时记录，自动保存到本机。</p>' +
        '</div><div style="text-align:right"><div class="hero-stat"><b>' + keys.length + '</b><span>条笔记</span></div></div></div>' +
        (keys.length ? '<div class="start-grid">' + cards + '</div>'
          : '<div class="list"><div class="empty"><span class="em">✎</span>还没有笔记<br>在练习卡片或总表里点 ✎ 就能写</div></div>') +
      '</div></div>';

    $$('#view-notes [data-note]').forEach(function (el) {
      el.addEventListener('click', function () { openDrawer(el.dataset.note); });
    });
  }

  /* ---------------------------------------------------------
     13. 笔记抽屉
     --------------------------------------------------------- */
  function openDrawer(eid) {
    var e = BY_ID[eid];
    if (!e) return;
    S.drawerEid = eid;
    $('#drawerTitle').textContent = e.head;
    var ref = e.mod === 'verbs'
      ? '<span class="de">' + esc(e.praes) + ' · ' + esc(e.praet) + ' · ' + (e.sein ? 'ist ' : 'hat ') + esc(e.perf) + '</span><br>' + esc(e.cn)
      : '<span class="de">' + esc(e.pattern) + '</span><br>' + esc(e.cn);
    $('#drawerRef').innerHTML = ref;
    $('#drawerTa').value = DB.notes[eid] || '';
    $('#drawerStatus').textContent = '已保存';
    $('#drawer').classList.add('on');
    $('#drawerMask').classList.add('on');
    setTimeout(function () { $('#drawerTa').focus(); }, 220);
    save();
  }
  function closeDrawer() {
    $('#drawer').classList.remove('on');
    $('#drawerMask').classList.remove('on');
    S.drawerEid = null;
    refreshChrome();
    if (S.view === 'mistakes') renderMistakes();
    if (S.view === 'notes') renderNotes();
    if (S.view === 'browse') renderBrowse();
    if (S.view === 'practice' && S.sess && S.sess.answered) renderPractice();
  }

  /* ---------------------------------------------------------
     13.5 手机扫码
     --------------------------------------------------------- */
  function openQr() {
    $('#qrMask').classList.add('on');
    $('#qrModal').classList.add('on');
    var img = $('#qrImg'), url = $('#qrUrl'), hint = $('#qrHint');
    img.src = '';
    img.style.display = 'none';
    url.textContent = '——';
    hint.textContent = '正在读取局域网地址…';
    var ts = Date.now();
    var served = location.protocol === 'http:' || location.protocol === 'https:';
    var lanSrc = served ? '/api/lan' : 'assets/lan.json';
    fetch(lanSrc + '?t=' + ts, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('no lan.json'); return r.json(); })
      .then(function (d) {
        img.src = (served ? '/api/qr.png' : 'assets/phone-qr.png') + '?t=' + ts;
        img.style.display = 'block';
        url.textContent = d.url;
        hint.textContent = '手机与电脑要在同一网络。若手机打不开，多半是当前 Wi-Fi 禁止设备互访（校园网 / 公共热点常见）：让手机开「个人热点」、电脑连上后刷新本页再扫即可。';
      })
      .catch(function () {
        url.textContent = '未启动本地服务';
        hint.textContent = '双击「启动.command」打开本程序后，这里会自动生成二维码；直接打开 index.html 时没有手机访问入口。';
      });
  }
  function closeQr() {
    $('#qrMask').classList.remove('on');
    $('#qrModal').classList.remove('on');
  }

  /* ---------------------------------------------------------
     14. 事件绑定
     --------------------------------------------------------- */
  function bindGlobal() {
    $$('.nav-item').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.nav;
        if (k === 'verbs' || k === 'colloc') { S.mod = k; go('module'); }
        else go(NAV_MAP[k] || k);
      });
    });

    $('#strictSwitch').addEventListener('click', function () {
      DB.settings.strict = !DB.settings.strict;
      this.classList.toggle('on', DB.settings.strict);
      this.setAttribute('aria-checked', String(DB.settings.strict));
      save();
      toast(DB.settings.strict ? '严格复习已开启：错词需过 3 遍' : '严格复习已关闭');
    });

    $('#mistakeCard').addEventListener('click', function () { go('mistakes'); });
    $('#qrBtn').addEventListener('click', openQr);
    $('#qrClose').addEventListener('click', closeQr);
    $('#qrMask').addEventListener('click', closeQr);

    $('#drawerClose').addEventListener('click', closeDrawer);
    $('#drawerMask').addEventListener('click', closeDrawer);
    $('#drawerClear').addEventListener('click', function () {
      if (!S.drawerEid) return;
      delete DB.notes[S.drawerEid];
      $('#drawerTa').value = '';
      $('#drawerStatus').textContent = '已清空';
      save(); refreshChrome();
    });
    var ta = $('#drawerTa');
    var t = null;
    ta.addEventListener('input', function () {
      if (!S.drawerEid) return;
      var v = ta.value;
      DB.notes[S.drawerEid] = v;
      $('#drawerStatus').textContent = '输入中…';
      clearTimeout(t);
      t = setTimeout(function () {
        save();
        $('#drawerStatus').textContent = '已保存';
      }, 320);
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { closeDrawer(); closeQr(); return; }
      if (S.view !== 'practice' || !S.sess || S.sess.done) return;
      if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
      var s = S.sess;
      if (!s.answered && s.mode === 'mc') {
        var n = parseInt(ev.key, 10);
        if (n >= 1 && n <= s.q.options.length) answerMC(n - 1);
      }
    });

    /* 禁止 Ctrl+滚轮缩放，保持界面固定 */
    window.addEventListener('wheel', function (ev) {
      if (ev.ctrlKey) ev.preventDefault();
    }, { passive: false });
    window.addEventListener('keydown', function (ev) {
      if ((ev.metaKey || ev.ctrlKey) && ['+', '=', '-', '0'].indexOf(ev.key) >= 0) ev.preventDefault();
    });
  }

  /* ---------------------------------------------------------
     15. 启动
     --------------------------------------------------------- */
  load();
  bindGlobal();
  (function hideQrOnPublic() {
    var h = location.hostname;
    var isLocal = h === '' || h === '127.0.0.1' || h === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(h);
    if (!isLocal && document.getElementById('qrBtn')) {
      document.getElementById('qrBtn').style.display = 'none';
    }
  })();
  $('#strictSwitch').classList.toggle('on', !!DB.settings.strict);
  $('#strictSwitch').setAttribute('aria-checked', String(!!DB.settings.strict));
  go('home');

  /* 暴露给调试 */
  window.__DD = { DB: DB, ENTRIES: ENTRIES, startSession: startSession, save: save, state: S, go: go };
})();

</script>
</body>
